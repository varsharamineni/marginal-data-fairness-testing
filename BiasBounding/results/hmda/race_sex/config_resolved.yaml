data:
  type: file
  params: {}
  path: data/hmda_processed/hmda_master_2017.parquet
preprocess:
- filter: sex in ['Male', 'Female']
- filter: income <= 100
- filter: race in ['White', 'Black', 'API']
roles:
  protected:
  - race
  - sex
  common:
  - income_bin
  features: []
  label: null
  internal: []
split:
  type: sample
  train: 0
  primary: 0.001
  aux_same_rows: false
  aux: all
  aggregate_aux: false
models:
- name: lender
  type: observed
  column: outcome
metrics: all
methods:
- name: independence
- name: joint
  num: 2
compare:
  seeds:
  - 0
  - 1
  tol: 1.0e-06
  plots: true
binning:
  max_categories: 20
  bins: 3
name: race_sex
